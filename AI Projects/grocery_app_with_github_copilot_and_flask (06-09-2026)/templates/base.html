<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}gather — fresh groceries, gathered for you{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="site-header">
        <div class="header-inner">
            <a class="brand" href="{{ url_for('home') }}"><span class="brand-mark">✳</span> gather</a>
            <nav class="main-nav" aria-label="Primary navigation">
                <a class="{{ 'active' if page == 'home' else '' }}" href="{{ url_for('home') }}">Home</a>
                <a class="{{ 'active' if page == 'products' else '' }}" href="{{ url_for('products') }}">Shop</a>
                <a href="#categories">Categories</a>
                <a href="#about">Our story</a>
            </nav>
            <div class="header-actions">
                <a class="icon-button" href="{{ url_for('favourites') }}" aria-label="Favourites">♡<span class="count-badge fav-count">0</span></a>
                <a class="icon-button bag-link" href="{{ url_for('cart') }}" aria-label="Shopping cart">♧<span class="count-badge cart-count">0</span></a>
                <button class="avatar" aria-label="Account">JD</button>
            </div>
        </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer" id="about">
        <div class="footer-inner">
            <div><a class="brand footer-brand" href="{{ url_for('home') }}"><span class="brand-mark">✳</span> gather</a><p>Good food, gathered simply.</p></div>
            <div class="footer-links"><a href="{{ url_for('products') }}">Shop all</a><a href="{{ url_for('favourites') }}">Favourites</a><a href="#about">Our story</a></div>
            <p class="copyright">© 2024 gather grocery co.</p>
        </div>
    </footer>
    <div class="toast" role="status" aria-live="polite"></div>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
